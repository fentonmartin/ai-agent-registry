name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate persona files
        run: python scripts/validate_personas.py

      - name: Check for duplicate keys
        run: python scripts/check_duplicates.py

      - name: Run sync script check
        run: python sync/sync_personas.py --check --identities config/identities.example.yaml

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
