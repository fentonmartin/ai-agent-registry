---
# AI Agent Registry — GitHub Pages configuration
# Theme: jekyll-theme-cayman (modern, clean, professional)

title: AI Agent Registry
description: A standardized, hierarchical persona system for multi-agent AI applications.
theme: jekyll-theme-cayman

repository: fentonmartin/ai-agent-registry
baseurl: /ai-agent-registry
url: https://fentonmartin.github.io

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude non-docs files from Pages build
exclude:
  - sync
  - scripts
  - config
  - examples
  - Gemfile
  - LICENSE
  - .github
  - _config.yml

# Default layout for docs files
defaults:
  - scope:
      path: "docs"
    values:
      layout: page
