---
# AI Agent Registry — GitHub Pages configuration
# Uses jekyll-theme-primer (GitHub's own clean, modern theme)

title: AI Agent Registry
description: A standardized, hierarchical persona system for multi-agent AI applications.
logo: /assets/images/logo.svg
theme: jekyll-theme-primer

# Show README.md as the homepage
repository: fentonmartin/ai-agent-registry
baseurl: /ai-agent-registry
url: https://fentonmartin.github.io

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude build artifacts and non-docs files
exclude:
  - pages_config.json
  - Gemfile
  - .github
  - sync
  - scripts
  - config
  - examples

# Navigation links
navigation_top:
  - title: Hierarchy
    url: /docs/HIERARCHY.md
  - title: Import Guide
    url: /docs/IMPORT-GUIDE.md
  - title: Naming
    url: /docs/NAMING.md
  - title: Contributing
    url: /CONTRIBUTING.md
  - title: License
    url: /LICENSE
